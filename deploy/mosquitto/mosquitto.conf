# Auf Port 1883 von überall erreichbar (nicht nur im Container)
listener 1883

# Verbindungen ohne Benutzername/Passwort erlauben – nur für die lokale Entwicklung!
allow_anonymous true

# Gespeicherte Nachrichten (z. B. "retained") überleben einen Neustart
persistence true
persistence_location /mosquitto/data/

# Logs auf die Konsole, damit "docker compose logs" sie anzeigt
log_dest stdout